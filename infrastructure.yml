AWSTemplateFormatVersion: '2010-09-09'
Description: Moringa School Capstone - Containerized Web App on ECS Fargate

Parameters:
  ContainerImage:
    Type: String
    Default:  REPLACE_WITH_YOUR_ECR_IMAGE_URI
    Description: URI of the Docker image stored in Amazon ECR

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the ECS service

  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: First public subnet in the selected VPC

  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Second public subnet in the selected VPC

Resources:
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: MoringaCapstoneCluster

  ECSLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/moringa-capstone-webapp
      RetentionInDays: 7

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ECSWebAppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP access to the capstone web app
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: moringa-capstone-webapp
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: webapp
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: 80
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ECSLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: webapp

  ECSService:
    Type: AWS::ECS::Service
    DependsOn: ECSCluster
    Properties:
      ServiceName: moringa-capstone-webapp-service
      Cluster: !Ref ECSCluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref ECSTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ECSWebAppSecurityGroup
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2

Outputs:
  ECSClusterName:
    Description: ECS cluster created by this stack
    Value: !Ref ECSCluster

  ECSServiceName:
    Description: ECS service created by this stack
    Value: !GetAtt ECSService.Name

  ContainerImage:
    Description: Image deployed to ECS
    Value: !Ref ContainerImage

  LogGroupName:
    Description: CloudWatch log group for the container
    Value: !Ref ECSLogGroup