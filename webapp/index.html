
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Submission Portal</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    header {
      background: #12304a;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
      color: #dbeafe;
    }

    main {
      max-width: 620px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 18px #0f172a12;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font: inherit;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      background: #087f8c;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      margin-top: 18px;
      overflow-wrap: anywhere;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <h1>Cloud Submission Portal</h1>
    <p>A simple website powered by AWS cloud services</p>
  </header>

  <main>
    <h2>Submit a message</h2>
    <p>Enter your details below and send them to our cloud API.</p>

    <form id="submission-form">
      <label for="name">Your name</label>
      <input
        type="text"
        id="name"
        name="name"
        maxlength="100"
        required
      >

      <label for="message">Your message</label>
      <textarea
        id="message"
        name="message"
        maxlength="2000"
        required
      ></textarea>

      <button type="submit" id="submit-button">Submit message</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer>
    AWS Cloud-Native Capstone Project
  </footer>

  <script src="app.js"></script>
</body>
</html>
